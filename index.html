    <!-- Fira Sans steht DB Type am nächsten, das aus derselben Werkstatt stammt
         (Spiekermann). Humanistische Grotesk, klare Ziffern, auf kleinen
         Bildschirmen gut lesbar — anders als die überall verwendete Inter.

         Dazu die schmale Variante: auf dem Bahnsteig ist alles Schmalschrift —
         Zugziele, Gleisnummern, Wegweiser. Sie trägt hier die Überschriften und
         die Marker, der Fließtext bleibt in der normalen Breite. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Condensed:wght@500;600;700&display=swap"
